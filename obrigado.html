<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title data-i18n="meta.ty">Pedido enviado — Grupo LSC</title>
  <link rel="icon" type="image/png" href="/assets/images/LOGO-sem_bg.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/site.css">
</head>
<body>
  <section class="hero hero-sub" style="min-height:100vh; padding:0;">
    <div class="hero-bg on" style="background-image:url('/assets/images/PV_LISBOA.jpg')"></div>
    <div class="container" style="text-align:center;">
      <img src="/assets/images/LOGO-sem_bg.png" alt="Grupo LSC" style="width:72px; margin:0 auto 24px; background:#fff; border-radius:16px; padding:8px;">
      <p class="eyebrow">✓</p>
      <h1 data-i18n="ty.title" style="margin-inline:auto;">Obrigado! Recebemos o seu pedido.</h1>
      <p data-i18n="ty.p" style="margin-inline:auto;">Vamos analisá-lo e responder com a maior brevidade — normalmente no próprio dia útil. Se for urgente, ligue (+351) 255 812 525.</p>
      <p id="nota-fotos" data-i18n="ev.okNoPhotos" style="display:none; margin-inline:auto; color:#fde68a; font-weight:600;">Pedido enviado, mas não foi possível anexar as fotografias. Por favor envie-as para geral@lusocabo.com.</p>
      <div class="hero-cta" style="justify-content:center;">
        <a href="/" class="btn btn-primary" data-i18n="ty.btn">Voltar ao site</a>
      </div>
    </div>
  </section>
  <script>
    if (new URLSearchParams(location.search).get("fotos") === "0") {
      document.getElementById("nota-fotos").style.display = "block";
    }
  </script>
  <script src="/assets/js/i18n.js"></script>
  <script src="/assets/js/site.js"></script>
</body>
</html>
